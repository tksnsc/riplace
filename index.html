```html
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>まとめ謎</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: #f7f7f4;
    color: #292929;
    font-family: "Noto Sans JP", "Yu Gothic", sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 24px 16px;
  }

  .container {
    width: 100%;
    max-width: 560px;
    text-align: center;
  }

  .step-label {
    font-size: 12px;
    letter-spacing: 3px;
    color: #777;
    margin-bottom: 18px;
  }

  h1 {
    font-size: 28px;
    font-weight: 500;
    letter-spacing: 3px;
    margin: 0 0 36px;
  }

  .description {
    min-height: 150px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px 24px;
    border-top: 1px solid #c9c9c3;
    border-bottom: 1px solid #c9c9c3;
    font-size: 16px;
    line-height: 2.2;
    white-space: pre-line;
    text-align: left;
  }

  .form {
    display: flex;
    gap: 10px;
    margin-top: 28px;
  }

  input {
    flex: 1;
    min-width: 0;
    padding: 15px;
    border: 1px solid #c9c9c3;
    border-radius: 0;
    background: #fff;
    font-size: 16px;
    outline: none;
  }

  input:focus {
    border-color: #456b59;
  }

  button {
    padding: 15px 25px;
    border: none;
    background: #456b59;
    color: #fff;
    font-size: 14px;
    letter-spacing: 1px;
    cursor: pointer;
  }

  button:hover {
    background: #355343;
  }

  button:disabled,
  input:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .message {
    min-height: 32px;
    margin-top: 20px;
    font-size: 16px;
    letter-spacing: 2px;
  }

  .message.correct {
    color: #456b59;
  }

  .message.wrong {
    color: #a14d43;
  }

  .hidden {
    display: none;
  }

  .clear-title {
    font-size: 34px;
    letter-spacing: 5px;
    color: #456b59;
    margin-bottom: 24px;
  }

  .clear-text {
    font-size: 16px;
    line-height: 2;
  }

  @media (max-width: 420px) {
    h1 {
      font-size: 23px;
    }

    .description {
      padding: 24px 16px;
      font-size: 14px;
    }

    .form {
      gap: 8px;
    }

    input {
      padding: 13px 10px;
    }

    button {
      padding: 13px 18px;
    }
  }
</style>
</head>

<body>
<main class="container">

  <div id="game">
    <div class="step-label" id="stepLabel">STEP 01</div>
    <h1>まとめ謎</h1>

    <div class="description" id="description">赤枠にパネルを当てはめ謎を成立させて、3つの答えを導いてください。</div>

    <form class="form" id="answerForm">
      <input
        type="text"
        id="answer"
        placeholder="答えを入力"
        autocomplete="off"
        required
      >
      <button type="submit" id="submitButton">送信</button>
    </form>

    <div class="message" id="message" aria-live="polite"></div>
  </div>

  <div id="clearScreen" class="hidden">
    <div class="clear-title">CLEAR</div>
    <div class="clear-text">
      おめでとうございます！<br>
      すべての謎をクリアしました。
    </div>
  </div>

</main>

<script>
  const steps = [
    {
      answer: "かいし",
      label: "STEP 01",
      description: "赤枠にパネルを当てはめ謎を成立させて、3つの答えを導いてください。"
    },
    {
      answer: "あんど",
      label: "STEP 02",
      description: "新たに3つの謎と3つのパネルが追加されました。\nすべての謎が成立するように再配置-Re:place-を行ってください。"
    },
    {
      answer: "あっと",
      label: "LAST STEP",
      description: "ここでは謎やパネルの追加は行われません。\n2ndで配置したパネルを置換-Replace-し、謎を解きなおしてください。\n置換のルール：「パネルのものを1つ次に置換する」"
    }
  ];

  let currentStep = 0;

  const form = document.getElementById("answerForm");
  const answerInput = document.getElementById("answer");
  const description = document.getElementById("description");
  const stepLabel = document.getElementById("stepLabel");
  const message = document.getElementById("message");

  form.addEventListener("submit", function(event) {
    event.preventDefault();

    const answer = answerInput.value.trim();
    const correctAnswer = steps[currentStep].answer;

    if (answer !== correctAnswer) {
      message.textContent = "不正解";
      message.className = "message wrong";
      answerInput.select();
      return;
    }

    if (currentStep === steps.length - 1) {
      document.getElementById("game").classList.add("hidden");
      document.getElementById("clearScreen").classList.remove("hidden");
      return;
    }

    message.textContent = "正解";
    message.className = "message correct";

    currentStep++;

    stepLabel.textContent = steps[currentStep].label;
    description.textContent = steps[currentStep].description;

    answerInput.value = "";
    answerInput.focus();
  });
</script>
</body>
</html>
